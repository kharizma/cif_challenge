x-db-env: &db-env
  DB_DRIVER: postgres
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: cif
  DB_PASSWORD: test
  DB_NAME: cif
  DB_SSLMODE: disable

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cif
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cif
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host access, so `go test` and psql can reach the same DB the app uses.
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cif -d cif"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: schema migrations, then exits. Runs on every `up`; no change is fine.
  migrate:
    build: ./backend
    image: cif-backend:local
    command: ["/app/migrate", "-dir", "/app/migrations", "up"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: cif-backend:local
    restart: unless-stopped
    environment:
      <<: *db-env
      PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CACHE_TTL_SECONDS: "300"
      UPLOAD_DIR: /app/uploads
      CUSTOMER_INFO_URL: https://candidate.free.beeceptor.com/api/customer-information
      SCORING_URL: https://candidate.free.beeceptor.com/api/scoring
    volumes:
      # Uploaded KTP/NPWP/... files stay on the host in backend/uploads.
      - ./backend/uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
